# spec file for repeated training with CESM2 forced data using NN shortterm EBM (= no 10 year averages)

directories:
  source_dir: data/processed/HIRHAM5-CESM2/v_04
  base_dir: data/processed/crossval/v_01
  data_file: CESM2_meltNNalbedo_trainval
  out_dir: output/repeated_CESM2_shorttermNN_log
  overwrite: false
  temp_split_file: train_val_split_future_100.json
  spatial_sub_file: GRL_subsampleidx_future_5000_flattened.zarr
  zones_file: GRLzones.zarr

data:
  input:
  - rainfall
  - snfall
  - energyin
  - dswrad
  prec_days: 9
  target:
  - snmel
  transform_inputs:
    rainfall: [log,1]
    snfall: [log,1]



model:
  hidden_activation: LeakyReLU
  layers_daily_feat_extractor:
  - 128
  - 128
  - 128
  layers_medrange_feat_extractor: null
  layers_regressor:
  - 160
  - 128
  - 128
  - 64
  layers_spinup_feat_extractor: []
  output_activation: ""
  use_season: true

training:
  restarts: 20
  batch_size: 512
  continue_training: false
  epochs: 300
  loss_reg: mse
  lr: 0.03
  lr_decay: 0.9
  lr_decay_epochs: 50
  optimizer: adam