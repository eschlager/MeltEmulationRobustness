# spec file for Crossvalidation on ERA-Interim forced data using Modular NN EBM

directories:
  base_dir: data/processed/crossval/v_01
  data_file: ERAI_meltNN
  out_dir: output/crossval_test
  overwrite: true
  temp_sub_file: temp_subsample_50_1990-1996.json
  spatial_sub_file: GRL_subsampleidx_5000_flattened.zarr
  zones_file: GRLzones.zarr

data:
  input:
  - albedom
  - tas
  - rainfall
  - snfall
  - energyin
  - dswrad
  - tas_10yr-avg
  - rainfall_10yr-avg
  - snfall_10yr-avg
  - energyin_10yr-avg
  - dswrad_10yr-avg
  prec_days: 9
  target:
  - snmel
  transform_inputs:
    rainfall: [log,1]
    snfall: [log,1]


model:
  hidden_activation: LeakyReLU
  layers_daily_feat_extractor:
  - 128
  - 128
  - 256
  layers_medrange_feat_extractor: null
  layers_regressor:
  - 256
  - 128
  - 64
  - 32
  - 16
  layers_spinup_feat_extractor:
  - 32
  - 32
  output_activation: ""
  use_season: true

training:
  restarts: 2
  batch_size: 16
  continue_training: false
  epochs: 2
  loss_reg: mse
  lr: 0.04
  lr_decay: 0.9
  lr_decay_epochs: 50
  optimizer: adam
