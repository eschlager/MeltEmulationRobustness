# spec file for Crossvalidation on ERA-Interim forced data using Modular NN EBM

directories:
  base_dir: data/processed/crossval/v_01
  data_file: ERAI_meltNN_transform
  out_dir: output/crossval_ERAI_modularNNEBM_noshuffle_smallNN_transform
  overwrite: false
  temp_sub_file: temp_subsample_100.json
  spatial_sub_file: GRL_subsampleidx_5000_flattened.zarr
  zones_file: GRLzones.zarr

data:
  input:
  - rainfall
  - snfall
  - energyin
  - dswrad
  - rainfall_10yr-avg
  - snfall_10yr-avg
  - energyin_10yr-avg
  - dswrad_10yr-avg
  prec_days: 9
  target:
  - snmel
  transform_inputs:  # parameters fit on sub-sampled data from odd years only
    rainfall: [yeo, -3.963]
    snfall: [yeo, -1.980]
    energyin: [yeo, 0.0387]
    rainfall_10yr-avg: [yeo, -5.368]
    snfall_10yr-avg: [yeo, -1.052]
    energyin_10yr-avg: [yeo, -0.813]


model:
  hidden_activation: LeakyReLU
  layers_daily_feat_extractor:
  - 128
  - 128
  - 128
  layers_medrange_feat_extractor: null
  layers_regressor:
  - 160
  - 128
  - 128
  - 64
  layers_spinup_feat_extractor:
  - 32
  - 32
  output_activation: ""
  use_season: true

training:
  restarts: 20
  batch_size: 512
  continue_training: false
  epochs: 300
  loss_reg: mse
  lr: 0.03
  lr_decay: 0.9
  lr_decay_epochs: 20
  optimizer: adam
